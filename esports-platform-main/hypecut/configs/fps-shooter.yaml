
profile: fps-shooter

signals:
  grid_fps: 5.0
  frame_width: 80
  frame_height: 45
  enabled:
    - audio_rms
    - audio_transient
    - scene_change
    - motion
    - roi_activity
    - flash
    - valorant_killfeed

  weights:
    audio_rms: 0.3
    audio_transient: 0.8
    scene_change: 0.1
    motion: 0.2
    roi_activity: 0.5
    flash: 0.1
    valorant_killfeed: 3.0

  params:
    roi_activity:
      box: [0.60, 0.02, 0.99, 0.26]
      threshold: 7

    valorant_killfeed:
      box: [0.60, 0.00, 1.00, 0.28]
      threshold: 5
      center_box: [0.18, 0.12, 0.82, 0.88]
      center_threshold: 7
      smooth_frames: 3

    audio_transient:
      lag: 2

  smooth_seconds: 1.0

segments:
  min_duration: 5.0
  max_duration: 14.0
  pre_roll: 3.5
  post_roll: 2.5
  merge_gap: 3.0
  percentile: 94.0
  max_clips: 0
  target_duration: 150.0
  snap_window: 2.0
  min_silence: 0.25

refiners:
  - diversity
  - pacing
  - similarity

refiner_params:
  pacing:
    ideal: 8.0
    tolerance: 4.0

  diversity:
    min_gap: 60.0
    strength: 0.4

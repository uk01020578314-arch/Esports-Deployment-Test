profile: pubg

signals:
  enabled:
    - audio_transient
    - valorant_killfeed
  weights:
    audio_transient: 0.4
    valorant_killfeed: 8.0
  params:
    audio_transient:
      lag: 1
    valorant_killfeed:
      box: [0.66, 0.00, 1.00, 0.30]
      threshold: 5
      center_box: [0.18, 0.12, 0.82, 0.86]
      center_threshold: 7
      smooth_frames: 2
  grid_fps: 5.0
  frame_width: 80
  frame_height: 45
  smooth_seconds: 0.8

segments:
  min_duration: 30.0
  max_duration: 60.0
  pre_roll: 10.0
  post_roll: 10.0
  merge_gap: 8.0
  percentile: 94.0
  min_prominence: 2.0
  max_clips: 2
  target_duration: 60.0
  snap_to_shots: true
  snap_window: 1.5
  trim_to_silence: true
  min_silence: 0.25

refiners:
  - diversity
  - pacing
  - similarity

refiner_params:
  pacing:
    ideal: 8.0
    tolerance: 4.0
  diversity:
    min_gap: 45.0
    strength: 0.5

render:
  preset: veryfast

